name: Manual four-second classification checks

on:
  push:
    paths:
      - binary/09_live_rp_button_4ch.py
      - docs/RP_MANUAL_4S.md
      - .github/workflows/rp-manual-4s.yml
      - requirements*.txt
  pull_request:
    paths:
      - binary/09_live_rp_button_4ch.py
      - docs/RP_MANUAL_4S.md
      - .github/workflows/rp-manual-4s.yml
      - requirements*.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax and command line
        run: |
          python -m py_compile binary/09_live_rp_button_4ch.py
          python binary/09_live_rp_button_4ch.py --help
      - name: Test button capture without hardware
        run: python binary/09_live_rp_button_4ch.py --self-test
